# ══════════════════════════════════════════════════════════════════════════════
# echo-c —— 「身份透传」链路第三跳（链式末端服务）
#
# echo-c 是「A → B → C」链式透传的末端：它只读网关注入的 X-User-* 头，
# 返回「我知道你是谁（第三跳）」。它不往下调，所以不需要 hostAliases / CA 挂载。
#
# ⚠️ K8S Service 名字必须叫 demo-c（匹配路由 backend k8s-demo-c）。
# ══════════════════════════════════════════════════════════════════════════════
apiVersion: apps/v1
kind: Deployment
metadata:
  name: demo-c
  namespace: default
  labels:
    app: demo-c
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: demo-c
  template:
    metadata:
      labels:
        app: demo-c
    spec:
      tolerations:
        - operator: Exists
      containers:
        - name: demo-c
          image: registry.example.com/library/echo-oidc-demo:20260924-aiapi3hop
          imagePullPolicy: IfNotPresent
          # 启动 echo-c.mjs（多服务共用一个镜像，用 command 选择）
          command: ["node", "echo-c.mjs"]
          ports:
            - name: http
              containerPort: 8080
          env:
            - name: PORT
              value: "8080"
            - name: TZ
              value: "Asia/Shanghai"
          readinessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 20
            periodSeconds: 30
            failureThreshold: 3
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 500m
              memory: 256Mi
---
apiVersion: v1
kind: Service
metadata:
  name: demo-c
  namespace: default
  labels:
    app: demo-c
spec:
  selector:
    app: demo-c
  ports:
    - name: http
      port: 80
      targetPort: 8080
  type: ClusterIP
